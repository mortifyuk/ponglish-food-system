<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ponglish Food · Payment status</title><style>body{font:16px/1.5 system-ui,sans-serif;background:#f6f6f0;color:#17241c;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}.card{max-width:520px;background:#fff;border:1px solid #e0e4da;border-radius:20px;padding:28px}h1{letter-spacing:-.04em}a{color:#1e6b46}</style></head><body><main class="card"><h1>Checking your order</h1><p id="status">Please wait while we retrieve your order status.</p><p id="ref"></p><p>Payment is confirmed only after the server receives and verifies the payment provider's notification. This page alone cannot confirm payment.</p><a href="/">Return to menu</a></main><script>const ref=new URLSearchParams(location.search).get('order');document.querySelector('#ref').textContent=ref?'Order reference: '+ref:'';async function check(){if(!ref){document.querySelector('#status').textContent='No order reference was supplied.';return}try{const r=await fetch('/api/orders/'+encodeURIComponent(ref));const d=await r.json();if(!r.ok)throw Error(d.error);document.querySelector('#status').textContent=`Order status: ${d.order.status}. Payment status: ${d.order.payment_status}. Total: ${d.order.currency} ${Number(d.order.total).toFixed(2)}.`}catch(e){document.querySelector('#status').textContent='We could not retrieve the order status. Please contact the restaurant and quote your order reference.'}}check();</script></body></html>
